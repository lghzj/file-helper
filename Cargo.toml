[package]
name = "file-helper"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.29", default-features = true }
chrono = { version = "0.4", features = ["clock"] }
dirs = "6"
notify = "8"
quick-xml = "0.38"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "rustls-tls"] }
zip = { version = "5", default-features = false, features = ["deflate"] }
