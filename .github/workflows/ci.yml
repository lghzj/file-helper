name: Rust CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release

  package-windows:
    name: Package Windows binary
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/file-helper.exe dist/file-helper.exe
          Compress-Archive -Path dist/file-helper.exe -DestinationPath "file-helper-${{ github.ref_name }}-windows.zip" -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: file-helper-${{ github.ref_name }}-windows
          path: file-helper-${{ github.ref_name }}-windows.zip
