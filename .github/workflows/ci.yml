name: Rust CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release

  package-macos:
    name: Package macOS binary
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/file-helper dist/file-helper-macos
          tar -czf file-helper-${GITHUB_REF_NAME}-macos.tar.gz -C dist file-helper-macos
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: file-helper-${{ github.ref_name }}-macos
          path: file-helper-${{ github.ref_name }}-macos.tar.gz
